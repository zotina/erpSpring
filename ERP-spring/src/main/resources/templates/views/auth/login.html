<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ERPNext</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fa; /* Light gray background */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 420px; /* Max width for the login box */
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden; /* To contain the border-top if we add one */
        }

        .login-logo-container {
            padding: 30px 20px 20px 20px; /* More padding at the top for logo */
            text-align: center;
            /* Optional: add a top border or different background
            background-color: #007bff;
            border-bottom: 1px solid #dee2e6; */
        }

        .login-logo-container img {
            max-width: 180px; /* Adjust as needed */
            margin-bottom: 10px;
        }
        .login-logo-container .brand-text {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0d6efd; /* Bootstrap primary color */
        }
        /* If using an icon as logo */
        .login-logo-container .fa-user-lock {
            font-size: 50px;
            color: #0d6efd; /* Bootstrap primary color */
            margin-bottom: 15px;
        }


        .login-form-section {
            padding: 30px;
        }

        .login-form-section .form-label {
            font-weight: 500;
        }

        .form-check-label {
            font-size: 0.9rem;
        }

        .form-link {
            font-size: 0.9rem;
            text-decoration: none;
        }
        .form-link:hover {
            text-decoration: underline;
        }

        .error-container {
            margin-bottom: 1rem;
        }
        .error-message {
            color: var(--bs-danger);
            font-size: 0.875em;
        }
        .input-group-text {
             width: 42px; /* Ensure icons have consistent width */
             justify-content: center;
        }

    </style>
</head>
<body>

    <div class="login-box border"> 
        <div class="login-logo-container">
            <!-- <i class="fas fa-user-lock"></i> -->
            <!-- <h4 class="mt-2 mb-0">ERPNext</h4> -->
        </div>

        <div class="login-form-section">
            <h1 class="h3 mb-1 text-center fw-normal">ERP-Next</h1>
            <p class="text-muted mb-4 text-center">Connectez-vous à votre compte</p>

            <!-- Affichage du message d'erreur -->
            <div th:if="${error}" class="alert alert-danger p-2 error-container" role="alert">
                <i class="fas fa-exclamation-triangle me-1"></i>
                <span class="error-message" th:text="${error}"></span>
            </div>

            <form action="/api/auth/login" method="post">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="text" id="email" name="usr" class="form-control form-control-lg" placeholder="Adresse email" required>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" name="pwd" class="form-control form-control-lg" placeholder="Mot de passe" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS (Optional, for components that require JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
